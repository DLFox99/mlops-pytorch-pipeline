apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
  labels:
    app: model-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG_PATH
              value: /app/configs/training_config.yaml
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: data-volume
              mountPath: /app/data
            - name: checkpoints-volume
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # ---- GPU bonus (Part D, +5 pts) ----
          # Uncomment on a GPU-enabled node/cluster with the NVIDIA device
          # plugin installed. Requires a CUDA-enabled torch build in the
          # training image and a node selector/toleration for the GPU pool.
          # resources:
          #   requests:
          #     cpu: "2"
          #     memory: 4Gi
          #     nvidia.com/gpu: 1
          #   limits:
          #     cpu: "2"
          #     memory: 4Gi
          #     nvidia.com/gpu: 1
      # nodeSelector:
      #   accelerator: nvidia-gpu
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
